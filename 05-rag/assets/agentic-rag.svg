<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:14px;font-weight:600;}
    .cap{font-size:12px;fill:#64748B;font-weight:600;}
    .edge{stroke:#94A3B8;stroke-width:2;fill:none;}
  </style>
  <rect x="12" y="12" width="916" height="296" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>

  <rect x="28"  y="133" width="104" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text class="lbl" x="80"  y="162" text-anchor="middle" fill="#1E40AF">Query</text>

  <!-- agent diamond (260,160) -->
  <polygon points="260,108 345,160 260,212 175,160" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text class="lbl" x="260" y="156" text-anchor="middle" fill="#92400E" font-size="13">Agent</text>
  <text class="lbl" x="260" y="173" text-anchor="middle" fill="#92400E" font-size="13">decides</text>

  <rect x="430" y="58"  width="150" height="52" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text class="lbl" x="505" y="81"  text-anchor="middle" fill="#334155" font-size="13">pick tool /</text>
  <text class="lbl" x="505" y="98"  text-anchor="middle" fill="#334155" font-size="13">write query</text>
  <rect x="640" y="58"  width="120" height="52" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text class="lbl" x="700" y="90"  text-anchor="middle" fill="#334155">Retrieve</text>

  <rect x="560" y="216" width="130" height="54" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="lbl" x="625" y="247" text-anchor="middle" fill="#5B21B6">Generate</text>
  <rect x="750" y="216" width="130" height="54" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text class="lbl" x="815" y="247" text-anchor="middle" fill="#15803D">Answer</text>

  <line class="edge" x1="132" y1="160" x2="173" y2="160" marker-end="url(#ah)"/>
  <!-- agent -> pick tool -->
  <path class="edge" d="M290,140 L400,84 L428,84" marker-end="url(#ah)"/>
  <text class="cap" x="330" y="108">need info</text>
  <line class="edge" x1="580" y1="84" x2="638" y2="84" marker-end="url(#ah)"/>
  <!-- retrieve -> back to agent (loop) -->
  <path class="edge" d="M700,110 L700,160 L347,160" marker-end="url(#ah)"/>
  <text class="cap" x="520" y="152" text-anchor="middle">results → re-query if weak</text>
  <!-- agent -> generate -->
  <path class="edge" d="M290,180 L520,240 L558,243" marker-end="url(#ah)"/>
  <text class="cap" x="360" y="228">enough context</text>
  <line class="edge" x1="690" y1="243" x2="748" y2="243" marker-end="url(#ah)"/>
</svg>
