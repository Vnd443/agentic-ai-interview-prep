<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" font-family="'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:14px;font-weight:600;}
    .cap{font-size:12px;fill:#64748B;font-weight:600;}
    .edge{stroke:#94A3B8;stroke-width:2;fill:none;}
    .gedge{stroke:#0D9488;stroke-width:2;fill:none;}
  </style>
  <rect x="12" y="12" width="936" height="236" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>

  <rect x="28"  y="103" width="104" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text class="lbl" x="80"  y="132" text-anchor="middle" fill="#1E40AF">Query</text>

  <rect x="160" y="103" width="140" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text class="lbl" x="230" y="126" text-anchor="middle" fill="#334155" font-size="13">extract</text>
  <text class="lbl" x="230" y="144" text-anchor="middle" fill="#334155" font-size="13">entities</text>

  <!-- knowledge graph panel -->
  <rect x="340" y="44" width="230" height="172" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="cap" x="455" y="66" text-anchor="middle" fill="#0F766E">Knowledge graph · multi-hop</text>
  <line class="gedge" x1="400" y1="110" x2="470" y2="95"  marker-end="url(#ah)"/>
  <line class="gedge" x1="470" y1="95"  x2="510" y2="150" marker-end="url(#ah)"/>
  <line class="gedge" x1="400" y1="110" x2="440" y2="170" marker-end="url(#ah)"/>
  <line class="gedge" x1="440" y1="170" x2="510" y2="150" marker-end="url(#ah)"/>
  <circle cx="400" cy="110" r="16" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <circle cx="470" cy="95"  r="16" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <circle cx="510" cy="150" r="16" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <circle cx="440" cy="170" r="16" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>

  <rect x="620" y="103" width="120" height="54" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="lbl" x="680" y="132" text-anchor="middle" fill="#5B21B6">Generate</text>
  <rect x="790" y="103" width="130" height="54" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text class="lbl" x="855" y="132" text-anchor="middle" fill="#15803D">Answer</text>

  <line class="edge" x1="132" y1="130" x2="158" y2="130" marker-end="url(#ah)"/>
  <line class="edge" x1="300" y1="130" x2="338" y2="130" marker-end="url(#ah)"/>
  <line class="edge" x1="570" y1="130" x2="618" y2="130" marker-end="url(#ah)"/>
  <text class="cap" x="594" y="122" text-anchor="middle">paths</text>
  <line class="edge" x1="740" y1="130" x2="788" y2="130" marker-end="url(#ah)"/>
</svg>
