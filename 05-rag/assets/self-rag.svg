<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    .lbl{font-size:14px;font-weight:600;}
    .cap{font-size:12px;fill:#64748B;font-weight:600;}
    .edge{stroke:#94A3B8;stroke-width:2;fill:none;}
  </style>
  <rect x="12" y="12" width="976" height="276" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>

  <rect x="26"  y="123" width="104" height="54" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text class="lbl" x="78"  y="152" text-anchor="middle" fill="#1E40AF">Query</text>

  <!-- decision 1 (245,150) retrieve needed? -->
  <polygon points="245,100 330,150 245,200 160,150" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text class="lbl" x="245" y="146" text-anchor="middle" fill="#92400E" font-size="12">Retrieve</text>
  <text class="lbl" x="245" y="163" text-anchor="middle" fill="#92400E" font-size="12">needed?</text>

  <rect x="400" y="52"  width="120" height="50" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text class="lbl" x="460" y="81"  text-anchor="middle" fill="#334155">Retrieve</text>

  <rect x="560" y="123" width="120" height="54" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="lbl" x="620" y="152" text-anchor="middle" fill="#5B21B6">Generate</text>

  <!-- decision 2 (790,150) supported? -->
  <polygon points="790,100 868,150 790,200 712,150" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text class="lbl" x="790" y="146" text-anchor="middle" fill="#92400E" font-size="12">Answer</text>
  <text class="lbl" x="790" y="163" text-anchor="middle" fill="#92400E" font-size="12">supported?</text>

  <rect x="900" y="123" width="76" height="54" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text class="lbl" x="938" y="152" text-anchor="middle" fill="#15803D" font-size="13">Answer</text>

  <line class="edge" x1="130" y1="150" x2="158" y2="150" marker-end="url(#ah)"/>
  <!-- yes -> retrieve -->
  <path class="edge" d="M270,120 L400,80" marker-end="url(#ah)"/>
  <text class="cap" x="320" y="96">yes</text>
  <!-- no -> generate -->
  <path class="edge" d="M290,168 L520,178 L558,166" marker-end="url(#ah)"/>
  <text class="cap" x="360" y="192">no — answer directly</text>
  <!-- retrieve -> generate -->
  <path class="edge" d="M460,102 L460,150 L558,150" marker-end="url(#ah)"/>
  <line class="edge" x1="680" y1="150" x2="710" y2="150" marker-end="url(#ah)"/>
  <!-- supported yes -> answer -->
  <line class="edge" x1="868" y1="150" x2="898" y2="150" marker-end="url(#ah)"/>
  <text class="cap" x="882" y="140">yes</text>
  <!-- supported no -> loop back to retrieve -->
  <path class="edge" d="M790,100 L790,36 L460,36 L460,50" marker-end="url(#ah)"/>
  <text class="cap" x="625" y="28" text-anchor="middle">no — re-retrieve / revise</text>
</svg>
